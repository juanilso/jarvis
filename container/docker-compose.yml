# Uso: dentro da pasta container/ ->  docker compose up -d --build
#      depois                     ->  docker compose exec dev bash
name: jarvis

services:
  dev:
    build:
      context: ..
      dockerfile: container/Dockerfile
      args:
        PHP_VERSION: "8.3"        # ajuste para a versão do seu cPanel
        INSTALL_SQLSRV: "false"   # "true" para extensões PHP de SQL Server
    image: jarvis-dev:latest
    container_name: jarvis-dev
    env_file:
      - path: .env.claude      # opcional: ANTHROPIC_API_KEY=sk-ant-... (uso por API em vez da assinatura)
        required: false
      - path: .env.ajudantes   # chaves das outras IAs (./ajudantes-configurar.sh)
        required: false
    volumes:
      - ${PROJETOS_DIR:-../../projetos}:/workspace   # pasta compartilhada com o PC (outras IAs/IDE enxergam)
      - claude-config:/home/dev/.claude              # login e configurações do Claude persistem
      - dev-home:/home/dev/.cache
    ports:
      - "127.0.0.1:8080:8080"   # php -S 0.0.0.0:8080 -t public  -> abra http://localhost:8080 no PC
    environment:
      CLAUDE_CONFIG_DIR: /home/dev/.claude   # login, tema e plugins ficam no volume e sobrevivem a recriações
      DB_HOST: mariadb
      DB_USER: dev
      DB_PASS: dev
      DB_NAME: dev
    depends_on: [mariadb]
    mem_limit: 4g
    restart: unless-stopped

  # Bot do Telegram: só sobe quando pedir ->  docker compose --profile telegram up -d
  telegram:
    image: jarvis-dev:latest
    container_name: jarvis-telegram
    profiles: ["telegram"]
    command: ["python3", "/opt/jarvis-bots/bot.py"]
    env_file:
      - path: .env.claude
        required: false
      - path: .env.ajudantes   # chaves das outras IAs (./ajudantes-configurar.sh)
        required: false
    environment:
      CLAUDE_CONFIG_DIR: /home/dev/.claude
      DB_HOST: mariadb
      DB_USER: dev
      DB_PASS: dev
      DB_NAME: dev
    volumes:
      - ${PROJETOS_DIR:-../../projetos}:/workspace
      - claude-config:/home/dev/.claude
      - dev-home:/home/dev/.cache          # modelo de transcrição fica salvo aqui
    depends_on: [dev]
    mem_limit: 3g
    restart: unless-stopped

  # Acesso web (VS Code no navegador): docker compose --profile web up -d
  # Abra pelo Tailscale (recomendado) ou túnel SSH. Senha: PASSWORD no .env.claude
  web:
    image: jarvis-dev:latest
    container_name: jarvis-web
    profiles: ["web"]
    command: ["code-server", "--bind-addr", "0.0.0.0:8443", "--auth", "password", "--disable-telemetry", "/workspace"]
    env_file:
      - path: .env.claude
        required: false
      - path: .env.ajudantes   # chaves das outras IAs (./ajudantes-configurar.sh)
        required: false
    environment:
      CLAUDE_CONFIG_DIR: /home/dev/.claude
      DB_HOST: mariadb
      DB_USER: dev
      DB_PASS: dev
      DB_NAME: dev
    volumes:
      - ${PROJETOS_DIR:-../../projetos}:/workspace
      - claude-config:/home/dev/.claude
      - dev-home:/home/dev/.cache
      - code-server-data:/home/dev/.local/share/code-server
    ports:
      - "127.0.0.1:8443:8443"
    depends_on: [dev]
    mem_limit: 2g
    restart: unless-stopped

  # Página web do Jarvis com microfone e voz: sobe junto com --profile web
  jarvisweb:
    image: jarvis-dev:latest
    container_name: jarvis-voz-web
    profiles: ["web"]
    command: ["python3", "/opt/jarvis-bots/web.py"]
    env_file:
      - path: .env.claude
        required: false
      - path: .env.ajudantes   # chaves das outras IAs (./ajudantes-configurar.sh)
        required: false
      - path: .env.atendimento   # chave do WhatsApp (WAHA): só o painel usa para responder clientes
        required: false
    environment:
      CLAUDE_CONFIG_DIR: /home/dev/.claude
      DB_HOST: mariadb
      DB_USER: dev
      DB_PASS: dev
      DB_NAME: dev
    volumes:
      - ${PROJETOS_DIR:-../../projetos}:/workspace
      - atendimento-segredos:/segredos      # config da API do painel (token): só este serviço monta
      - claude-config:/home/dev/.claude
      - dev-home:/home/dev/.cache
    ports:
      - "127.0.0.1:8090:8090"
      - "127.0.0.1:8081:8081"   # prévia dos sites (botão 👁 no painel)
    depends_on: [dev]
    mem_limit: 4g
    restart: unless-stopped

  # Hermes Agent (Nous Research, MIT) como AJUDANTE do Jarvis: ./hermes-configurar.sh
  # Isolado: sem porta publicada, sem GitHub/Telegram, e /workspace só para leitura.
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: jarvis-hermes
    profiles: ["hermes"]
    command: ["gateway", "run"]
    env_file:
      - path: .env.hermes   # criado pelo ./hermes-configurar.sh: só a chave/endereço do gateway e a chave interna
        required: false
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0      # só dentro da rede do docker (nenhuma porta aberta na VPS)
      API_SERVER_PORT: "8642"
      TERMINAL_CWD: /workspace
    volumes:
      - hermes-data:/opt/data                         # config, memória e skills do Hermes
      - ${PROJETOS_DIR:-../../projetos}:/workspace:ro # lê os projetos, não altera
      - ${PROJETOS_DIR:-../../projetos}/.hermes-saida:/saida  # único lugar onde ele grava (zips, relatórios)
      - ./hermes/SOUL.md:/opt/jarvis-hermes/SOUL.md:ro         # personalidade em português (copiada pelo script)
    mem_limit: 2g
    restart: unless-stopped

  # n8n: rotinas e integrações (agendamentos, webhooks, WhatsApp, planilhas…). ./automacoes-configurar.sh
  # Fala com o Jarvis/Hermes só pelo gatilho protegido (/api/gatilho). Acesso pelo Tailscale, porta 5678.
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: jarvis-n8n
    profiles: ["automacoes"]
    env_file:
      - path: .env.n8n          # criado pelo script: chave de criptografia e token do gatilho
        required: false
    environment:
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_PORT: "5678"
      N8N_SECURE_COOKIE: "false"           # acesso só pela VPN (Tailscale)
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false" # os fluxos leem o token com {{$env.JARVIS_TOKEN}}
      JARVIS_GATILHO_URL: http://jarvisweb:8090/api/gatilho
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/opt/jarvis-n8n:ro            # fluxos de exemplo para importar
    ports:
      - "127.0.0.1:5678:5678"
    mem_limit: 1g
    restart: unless-stopped

  # WhatsApp Web (WAHA Core, Apache 2.0) para o atendimento automático: ./whatsapp-configurar.sh
  # Sem porta aberta: o painel do Jarvis mostra o QR code (📱). Só o n8n e o Jarvis falam com ele.
  whatsapp:
    # Motor GOWS (Go, sem navegador): o NOWEB parava de RECEBER em tempo real (só chegava tudo ao reiniciar).
    # Voltar ao antigo: WAHA_IMAGEM=devlikeapro/waha:latest e WAHA_MOTOR=NOWEB no arquivo .env (pede QR de novo).
    image: ${WAHA_IMAGEM:-devlikeapro/waha:gows-2026.10.1}
    container_name: jarvis-whatsapp
    profiles: ["whatsapp"]
    env_file:
      - path: .env.whatsapp      # criado pelo script: chave da API e senha do dashboard
        required: false
    environment:
      WHATSAPP_DEFAULT_ENGINE: ${WAHA_MOTOR:-GOWS}   # sem navegador: leve
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
      WAHA_RESTART_ALL_SESSIONS: "True"
      WAHA_PRINT_QR: "False"
      WHATSAPP_HOOK_URL: http://n8n:5678/webhook/whatsapp-waha
      WHATSAPP_HOOK_EVENTS: message.any
      TZ: America/Sao_Paulo
    volumes:
      - whatsapp-sessoes:/app/.sessions
    mem_limit: 1g
    restart: unless-stopped

  # Leitor de pagamentos (opcional): lê na SUA conta do Telegram só a conversa com o bot de pagamentos
  # (@DastDePixPartnerBot) e repassa ao Jarvis. ./pagamentos-configurar.sh
  leitor:
    image: jarvis-dev:latest
    container_name: jarvis-leitor-pagamentos
    profiles: ["pagamentos"]
    command: ["python3", "/opt/jarvis-bots/leitor_pagamentos.py"]
    env_file:
      - path: .env.pagamentos    # só: TG_API_ID, TG_API_HASH, PAGAMENTOS_BOT e o token do gatilho
        required: false
    volumes:
      - pagamentos-sessao:/sessao
    mem_limit: 256m
    restart: unless-stopped

  mariadb:
    image: mariadb:11
    container_name: jarvis-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: dev
      MARIADB_USER: dev
      MARIADB_PASSWORD: dev
    volumes:
      - mariadb-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"   # acesso pelo PC (HeidiSQL, DBeaver): localhost:3307
    mem_limit: 1g
    restart: unless-stopped

  # SQL Server: só sobe quando pedir ->  docker compose --profile sqlserver up -d
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: jarvis-sqlserver
    profiles: ["sqlserver"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Dev@Local123"
      MSSQL_PID: "Developer"
    volumes:
      - sqlserver-data:/var/opt/mssql
    ports:
      - "127.0.0.1:1433:1433"
    mem_limit: 2g

volumes:
  claude-config:
  atendimento-segredos:
  pagamentos-sessao:
  hermes-data:
  n8n-data:
  whatsapp-sessoes:
  code-server-data:
  dev-home:
  mariadb-data:
  sqlserver-data:
