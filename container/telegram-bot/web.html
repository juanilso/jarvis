<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05090f">
<title>Jarvis</title>
<style>
:root{--bg:#05090f;--pn:rgba(10,24,38,.72);--ln:rgba(56,189,248,.22);--ln2:rgba(56,189,248,.5);--c:#38bdf8;--c2:#7dd3fc;
--t:#d6f1ff;--m:#6b8aa3;--ok:#34d399;--er:#fb7185;--wa:#fbbf24;--mono:ui-monospace,"Cascadia Code",Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
body{background-image:linear-gradient(rgba(56,189,248,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.04) 1px,transparent 1px);background-size:32px 32px}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%;max-width:1400px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--ln)}
.logo{font-family:var(--mono);letter-spacing:.35em;font-size:16px;color:var(--c2);margin-right:auto}
.logo small{display:block;letter-spacing:.12em;font-size:10px;color:var(--m)}
select,button,textarea{font:inherit;color:var(--t);background:rgba(8,20,32,.9);border:1px solid var(--ln);border-radius:6px}
select,button{padding:6px 10px;cursor:pointer}button:hover,select:hover{border-color:var(--ln2)}
main{display:grid;grid-template-columns:230px minmax(0,1fr) 270px;gap:12px;padding:12px 14px;min-height:0}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:12px;overflow:auto;min-height:0;position:relative}
.pn h3{margin:0 0 10px;font:500 11px var(--mono);letter-spacing:.2em;color:var(--c);text-transform:uppercase}
.pn::before,.pn::after{content:"";position:absolute;width:10px;height:10px;border-color:var(--c)}
.pn::before{top:-1px;left:-1px;border-top:2px solid;border-left:2px solid;border-radius:10px 0 0 0}
.pn::after{bottom:-1px;right:-1px;border-bottom:2px solid;border-right:2px solid;border-radius:0 0 10px 0}
.ag{display:flex;align-items:center;gap:10px;padding:5px 2px;border-bottom:1px dashed rgba(56,189,248,.1);font-size:13px}
.ag .nm{display:flex;flex-direction:column;min-width:0}.ag .ds{font-size:11px;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.ag .st{margin-left:auto;font:11px var(--mono);color:var(--m)}
.robo{width:34px;height:34px;flex:none;--rc:#2b4a60;--olho:#1e3a4f}
.robo .cab,.robo .corpo,.robo .orelha{fill:#0a1824;stroke:var(--rc);stroke-width:1.4}
.robo .olho{fill:var(--olho)}.robo .ant{fill:var(--olho)}.robo .boca,.robo .haste{stroke:var(--rc);stroke-width:1.4}
.ag.ativo .robo{--rc:var(--c);--olho:var(--c);animation:bob .9s ease-in-out infinite}
.ag.ativo .robo .olho{filter:drop-shadow(0 0 3px var(--c))}.ag.ativo .robo .ant{animation:pl .5s infinite}
.ag.ativo .st{color:var(--c)}
.ag.ok .robo{--rc:var(--ok);--olho:var(--ok)}.ag.ok .st{color:var(--ok)}
.ag.erro .robo{--rc:var(--er);--olho:var(--er)}.ag.erro .st{color:var(--er)}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes pl{50%{opacity:.35}}
#centro{display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;min-height:0}
#orbbox{display:flex;align-items:center;gap:14px;justify-content:center}
#orb{width:340px;height:300px}
#estadoOrb{font:12px var(--mono);letter-spacing:.2em;color:var(--c2);text-transform:uppercase;min-width:110px}
#estadoOrb small{display:block;letter-spacing:.05em;color:var(--m);text-transform:none;font-size:12px;max-width:220px}
#log{display:flex;flex-direction:column;gap:8px}
.msg{max-width:92%;padding:8px 12px;border-radius:8px;white-space:pre-wrap;word-wrap:break-word;border:1px solid var(--ln)}
.eu{align-self:flex-end;background:rgba(56,189,248,.14);border-color:var(--ln2)}
.jv{align-self:flex-start;background:rgba(8,20,32,.85)}
.ev{font:12px var(--mono);color:var(--m)}.ev.ok{color:var(--ok)}.ev.erro,.err{color:var(--er)}
.hora{font:11px var(--mono);color:var(--m);margin-top:4px}
pre{background:#020509;border:1px solid var(--ln);padding:8px;border-radius:6px;overflow-x:auto;white-space:pre;margin:6px 0}
code{font-family:var(--mono);font-size:12.5px;color:var(--c2)}
audio{width:100%;margin-top:6px;height:34px;filter:invert(.85) hue-rotate(160deg)}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}.kv b{font-weight:500;color:var(--c2)}
.bar{height:6px;background:#0d2233;border-radius:3px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--c);width:0;transition:width .6s}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{font:11px var(--mono);padding:2px 8px;border-radius:10px;border:1px solid var(--ln)}
.tk{font-size:12.5px;padding:5px 0;border-bottom:1px dashed rgba(56,189,248,.1)}.tk code{margin-right:6px}
.dec{display:block;width:100%;text-align:left;margin-top:6px;font-size:12.5px;border-color:rgba(251,191,36,.4);color:var(--wa)}
.vazio{color:var(--m);font-size:12.5px}
footer{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--ln);padding-bottom:max(10px,env(safe-area-inset-bottom))}
textarea{flex:1;resize:none;padding:10px;height:46px;max-height:140px}
#mic,#enviar{width:50px;height:46px;font-size:20px;padding:0}
#mic.gravando{background:rgba(251,113,133,.25);border-color:var(--er);animation:pl 1s infinite}
#btnPainel{display:none}
@media (max-width:980px){
  main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);overflow:auto}
  #agentes,#projeto{display:none}
  main.abrir #agentes,main.abrir #projeto{display:block}
  #orb{width:230px;height:205px}
  #btnPainel{display:inline-block}
  #centro{min-height:60vh}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">JARVIS<small>orquestrador de projetos</small></div>
    <select id="projetoSel" title="Projeto"></select>
    <select id="audio" title="Resposta em áudio">
      <option value="auto">🔊 auto</option><option value="sempre">🔊 sempre</option><option value="nunca">🔇 nunca</option>
    </select>
    <button id="agentesBtn" title="Avisos dos agentes">👥 on</button>
    <button id="btnPainel" title="Mostrar painéis">📋</button>
    <button id="novo" title="Conversa nova neste projeto">🆕</button>
    <button id="parar" title="Parar">⛔</button>
  </header>
  <main id="main">
    <section class="pn" id="agentes"><h3>Agentes</h3><div id="listaAg"></div></section>
    <section id="centro">
      <div id="orbbox"><canvas id="orb"></canvas><div id="estadoOrb">em espera<small id="estadoTxt"></small></div></div>
      <div class="pn" id="logbox"><h3>Registro</h3><div id="log"></div></div>
    </section>
    <section class="pn" id="projeto"><h3>Projeto</h3><div id="infoProj" class="vazio">Escolha um projeto.</div></section>
  </main>
  <footer>
    <button id="mic" title="Gravar áudio (clique para começar e para enviar)">🎙️</button>
    <textarea id="texto" placeholder="Fale ou escreva a demanda…"></textarea>
    <button id="enviar" title="Enviar">➤</button>
  </footer>
</div>
<script>
const $=id=>document.getElementById(id);
const AGENTES=[["arquiteto","🏛️"],["explorador","🔎"],["desenvolvedor","💻"],["dba","🗄️"],["android","🤖"],["testador","🧪"],["revisor","🧐"],["deploy","🚀"],["documentador","📝"]];
let ultimo=0,agentesOn=true,ocupado=false,gravador=null,pedacos=[],t0=0,timerG=null,modo="espera",nivel=0,ctx=null,analyser=null,carregado=false;
const agEstado={};

function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fmt(t){return esc(t).replace(/```(\w*)\n?([\s\S]*?)```/g,(m,l,c)=>`<pre><code>${c}</code></pre>`).replace(/`([^`\n]+)`/g,"<code>$1</code>")}
async function api(c,b){const r=await fetch(c,b===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});if(r.status===401){location.reload();return{}}return r.json()}
function add(cls,html){const d=document.createElement("div");d.className=cls;d.innerHTML=html;const box=$("logbox");const perto=box.scrollHeight-box.scrollTop-box.clientHeight<140;$("log").appendChild(d);if(perto)box.scrollTop=box.scrollHeight;return d}

/* ---------- estado visual ---------- */
function setModo(m,txt){modo=m;$("estadoOrb").firstChild.nodeValue={espera:"em espera",ouvindo:"ouvindo",pensando:"processando",falando:"falando"}[m];$("estadoTxt").textContent=txt||""}
const ROBO=`<svg class="robo" viewBox="0 0 40 40" aria-hidden="true"><line class="haste" x1="20" y1="5" x2="20" y2="10"/><circle class="ant" cx="20" cy="4" r="2.6"/><rect class="orelha" x="4" y="15" width="4" height="7" rx="1.5"/><rect class="orelha" x="32" y="15" width="4" height="7" rx="1.5"/><rect class="cab" x="8" y="10" width="24" height="17" rx="5"/><circle class="olho" cx="15" cy="18" r="2.8"/><circle class="olho" cx="25" cy="18" r="2.8"/><line class="boca" x1="16" y1="23" x2="24" y2="23"/><rect class="corpo" x="12" y="29" width="16" height="9" rx="3"/></svg>`;
function desenharAgentes(){
  $("listaAg").innerHTML=AGENTES.map(([n,e])=>{const s=agEstado[n]||{c:"",t:"ocioso",d:""};
    return `<div class="ag ${s.c}">${ROBO}<div class="nm"><span>${n}</span><span class="ds">${esc(s.d||"")}</span></div><span class="st">${esc(s.t)}</span></div>`}).join("");
}
function agente(ev){
  if(ev.tipo==="agente_inicio") agEstado[ev.agente]={c:"ativo",t:"ativo",d:ev.descricao};
  else{agEstado[ev.agente]={c:ev.erro?"erro":"ok",t:ev.erro?"erro":`ok ${ev.segundos}s`,d:(agEstado[ev.agente]||{}).d};
    setTimeout(()=>{if(agEstado[ev.agente]&&agEstado[ev.agente].c!=="ativo"){delete agEstado[ev.agente];desenharAgentes()}},30000)}
  desenharAgentes();
}

/* ---------- painel do projeto ---------- */
async function painel(){
  const p=await api("/api/painel");const box=$("infoProj");
  if(!p.adotado){box.innerHTML=`<div class="vazio">Projeto ainda sem docs do Jarvis. Envie: <code>estude o painel e crie a documentação do Jarvis</code></div>`;return}
  const c=p.contagem||{},tot=Object.values(c).reduce((a,b)=>a+b,0),feitas=c.feita||0,pct=tot?Math.round(feitas*100/tot):0;
  box.innerHTML=`<div class="kv"><span>Perfil</span><b>${esc(p.perfil||"—")}</b></div>
   <div class="kv"><span>Concluído</span><b>${feitas}/${tot} · ${pct}%</b></div><div class="bar"><i style="width:${pct}%"></i></div>
   <div class="chips">${Object.entries(c).map(([k,v])=>`<span class="chip">${esc(k)} ${v}</span>`).join("")}</div>
   <h3 style="margin-top:14px">Próximas</h3>${(p.proximas||[]).map(t=>`<div class="tk"><code>${esc(t.id)}</code>${esc(t.titulo)}</div>`).join("")||'<div class="vazio">Nada pendente.</div>'}
   <h3 style="margin-top:14px">Decisões pendentes</h3>${(p.decisoes||[]).map(d=>`<button class="dec" data-id="${esc(d.id)}">⚠ ${esc(d.id)} · ${esc(d.titulo)}</button>`).join("")||'<div class="vazio">Nenhuma.</div>'}
   ${(p.estado||[]).length?`<h3 style="margin-top:14px">Estado</h3>`+p.estado.map(l=>`<div class="tk">${esc(l)}</div>`).join(""):""}`;
  box.querySelectorAll(".dec").forEach(b=>b.onclick=()=>{$("texto").value=`/jarvis:decidir ${b.dataset.id} `;$("texto").focus()});
}

/* ---------- eventos ---------- */
function tocar(src,el){
  const a=document.createElement("audio");a.controls=true;a.src=src;el.appendChild(a);
  if(ctx&&ctx.state==="running"){try{const s=ctx.createMediaElementSource(a);s.connect(analyser);}catch(e){}}
  a.onplay=()=>setModo("falando");a.onended=a.onpause=()=>setModo(ocupado?"pensando":"espera");
  if(carregado)a.play().catch(()=>{});
}
function mostrar(ev){
  const h=`<div class="hora">${ev.hora}</div>`;
  if(ev.tipo==="usuario")add("msg eu",esc(ev.texto)+h);
  else if(ev.tipo==="agente_inicio"){add("ev",`${ev.emoji} ${esc(ev.agente)} › ${esc(ev.descricao)}`);agente(ev);if(carregado)setModo("pensando",`${ev.agente}: ${ev.descricao}`)}
  else if(ev.tipo==="agente_fim"){add("ev "+(ev.erro?"erro":"ok"),`${ev.emoji} ${esc(ev.agente)} ${ev.erro?"✕ erro":"✓ concluiu"} (${ev.segundos}s)`);agente(ev)}
  else if(ev.tipo==="erro")add("msg jv err","⚠ "+esc(ev.texto)+h);
  else if(ev.tipo==="sistema")add("ev",esc(ev.texto));
  else if(ev.tipo==="resposta"){
    const custo=ev.custo?`<div class="hora">custo US$ ${Number(ev.custo).toFixed(4)}</div>`:"";
    const d=add("msg jv",(ev.erro?"⚠ ":"")+fmt(ev.texto)+custo+h);
    if(ev.voz)tocar(ev.voz,d);
    if(carregado)painel();
  }
}
async function poll(){
  try{const r=await api("/api/eventos?desde="+ultimo);(r.eventos||[]).forEach(mostrar);ultimo=r.ultimo||ultimo;
    if(r.ocupado!==ocupado){ocupado=r.ocupado;if(modo!=="falando"&&modo!=="ouvindo")setModo(ocupado?"pensando":"espera")}}catch(e){}
  carregado=true;setTimeout(poll,1500);
}
async function estado(){
  const e=await api("/api/estado");
  $("projetoSel").innerHTML='<option value="">Escolha o projeto…</option>'+e.projetos.map(p=>`<option ${p===e.projeto?"selected":""}>${esc(p)}</option>`).join("");
  $("audio").value=e.audio;agentesOn=e.agentes;$("agentesBtn").textContent="👥 "+(agentesOn?"on":"off");painel();
}

/* ---------- ações ---------- */
function prepararAudio(){if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)();analyser=ctx.createAnalyser();analyser.fftSize=256;analyser.connect(ctx.destination)}catch(e){}}if(ctx&&ctx.state!=="running")ctx.resume()}
document.addEventListener("click",prepararAudio,{once:false});
async function enviar(){const t=$("texto").value.trim();if(!t)return;const r=await api("/api/mensagem",{texto:t});if(r.erro)add("ev erro",esc(r.erro));else{$("texto").value="";setModo("pensando")}}
$("enviar").onclick=enviar;
$("texto").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();enviar()}});
$("projetoSel").onchange=async e=>{await api("/api/config",{projeto:e.target.value});add("ev","projeto › "+esc(e.target.value));estado()};
$("audio").onchange=e=>api("/api/config",{audio:e.target.value});
$("agentesBtn").onclick=async()=>{agentesOn=!agentesOn;await api("/api/config",{agentes:agentesOn});$("agentesBtn").textContent="👥 "+(agentesOn?"on":"off")};
$("btnPainel").onclick=()=>$("main").classList.toggle("abrir");
$("novo").onclick=()=>api("/api/novo",{});
$("parar").onclick=()=>api("/api/parar",{});
$("mic").onclick=async()=>{
  if(gravador&&gravador.state==="recording"){gravador.stop();return}
  if(!navigator.mediaDevices){add("ev erro","O microfone só funciona em HTTPS (Tailscale) ou localhost.");return}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    const tipo=MediaRecorder.isTypeSupported("audio/webm")?"audio/webm":"audio/mp4";
    gravador=new MediaRecorder(st,{mimeType:tipo});pedacos=[];
    let micA=null;try{prepararAudio();micA=ctx.createMediaStreamSource(st);const an=ctx.createAnalyser();an.fftSize=256;micA.connect(an);window._micAn=an}catch(e){}
    gravador.ondataavailable=e=>pedacos.push(e.data);
    gravador.onstop=async()=>{
      st.getTracks().forEach(t=>t.stop());clearInterval(timerG);window._micAn=null;
      $("mic").classList.remove("gravando");$("mic").textContent="🎙️";setModo("pensando","transcrevendo…");
      const r=await fetch("/api/audio",{method:"POST",headers:{"Content-Type":tipo},body:new Blob(pedacos,{type:tipo})});
      const j=await r.json();
      if(j.erro&&!j.texto){add("ev erro",esc(j.erro));setModo("espera")}
      else if(j.erro){add("ev erro","entendi “"+esc(j.texto)+"”, mas: "+esc(j.erro));setModo("espera")}
    };
    gravador.start();t0=Date.now();$("mic").classList.add("gravando");setModo("ouvindo","clique de novo para enviar");
    timerG=setInterval(()=>{$("mic").textContent=Math.floor((Date.now()-t0)/1000)+"s"},500);
  }catch(e){add("ev erro","Não consegui acessar o microfone: "+esc(e.message))}
};

/* ---------- holograma 3D: cérebro neural / rosto falando ---------- */
const cv=$("orb"),g=cv.getContext("2d"),buf=new Uint8Array(128);
function amp(an){if(!an)return 0;an.getByteFrequencyData(buf);let s=0;for(let i=0;i<buf.length;i++)s+=buf[i];return s/buf.length/255}
const TAU=Math.PI*2,G=(x,s)=>Math.exp(-(x/s)*(x/s));
/* rosto: grade em linhas de varredura sobre a superfície frontal da cabeça, com relevo e luz */
function larg(y){const b=Math.sqrt(Math.max(0,1-(y/.95)**2));return .64*b*(y<0?1-.36*Math.pow(-y/.95,1.5):1)}
function altura(x,y){const a=larg(y);if(a<=0)return -1;const q=1-(x/a)**2;if(q<0)return -1;
  let z=.62*Math.sqrt(Math.max(0,1-(y/.95)**2))*Math.sqrt(q);
  z+=.19*G(x,.065)*G(y+.03,.19)+.07*G(x,.085)*G(y+.17,.055);          /* nariz */
  z-=.085*(G(x-.25,.11)+G(x+.25,.11))*G(y-.19,.07);                    /* órbitas */
  z+=.035*(G(x-.25,.06)+G(x+.25,.06))*G(y-.19,.035);                   /* olhos */
  z+=.05*G(y-.3,.045)*G(x,.4);                                          /* sobrancelhas */
  z+=.05*G(Math.abs(x)-.32,.11)*G(y+.04,.13);                           /* maçãs */
  z+=.045*G(x,.16)*G(y+.39,.035)+.05*G(x,.15)*G(y+.47,.04);             /* lábios */
  z+=.05*G(x,.17)*G(y+.73,.08);                                          /* queixo */
  return z}
const FP=[];
for(let y=.93;y>-.93;y-=.022){const a=larg(y);for(let x=-a;x<=a;x+=.019){const z=altura(x,y);if(z<0)continue;
  const e=.01,nx=-(altura(x+e,y)-altura(x-e,y))/(2*e),ny=-(altura(x,y+e)-altura(x,y-e))/(2*e),nl=Math.hypot(nx,ny,1);
  let luzR=Math.max(0,(-.35*nx+.45*ny+.82)/nl);
  const olho=Math.min(G(x-.25,.075)*G(y-.19,.035)>.3?1:0+(G(x+.25,.075)*G(y-.19,.035)>.3?1:0),1);
  const iris=olho&&Math.abs(Math.hypot(Math.abs(x)-.25,(y-.19)*1.6)-.03)<.012?1:0;
  const linhaBoca=Math.abs(y+.43)<.011&&Math.abs(x)<.15;
  FP.push([x,y,z,luzR,olho,iris,linhaBoca?1:0,y<-.43?G(x,.22)*Math.min(1,(-.43-y)/.25):0])}}
const N=FP.length;
const F=new Float32Array(N*3),sombra=new Float32Array(N),olhoP=new Uint8Array(N),irisP=new Uint8Array(N),bocaL=new Uint8Array(N),mand=new Float32Array(N);
FP.forEach((p,i)=>{F[i*3]=p[0];F[i*3+1]=p[1];F[i*3+2]=p[2];sombra[i]=p[3];olhoP[i]=p[4];irisP[i]=p[5];bocaL[i]=p[6];mand[i]=p[7]});
/* cérebro: dois hemisférios com giros + cerebelo, com sombreamento pela normal */
const B=new Float32Array(N*3),Bl=new Float32Array(N);
for(let i=0;i<N;i++){let x,y,z,nx,ny,nz;
  if(i<N*.88){const lado=i%2?1:-1,u=Math.random()*TAU,v=Math.acos(2*Math.random()-1);
    const dobra=1+.08*Math.sin(9*u+3*Math.sin(5*v))*Math.sin(7*v+u);
    let sx=Math.sin(v)*Math.cos(u),sy=Math.cos(v),sz=Math.sin(v)*Math.sin(u);
    if(sx*lado<-.15)sx=-.15*lado+(sx+.15*lado)*.25;
    nx=sx;ny=sy;nz=sz;x=(lado*.33+sx*.36)*dobra;y=(sy*.52)*dobra+.05;z=(sz*.72)*dobra;if(y<-.25)y=-.25+(y+.25)*.5;
    Bl[i]=.35+.65*Math.max(0,.5+.5*Math.sin(9*u+3*Math.sin(5*v))*Math.sin(7*v+u));   /* giros mais claros */
  }else{const u=Math.random()*TAU,v=Math.acos(2*Math.random()-1),d=1+.06*Math.sin(16*v);
    x=Math.sin(v)*Math.cos(u)*.42*d;y=-.42+Math.cos(v)*.17*d;z=-.42+Math.sin(v)*Math.sin(u)*.26*d;Bl[i]=.4+.6*Math.abs(Math.sin(16*v))}
  B[i*3]=x;B[i*3+1]=y;B[i*3+2]=z}
/* vizinhança para propagar sinapses no cérebro */
const viz=[];{const cel=.09,h=new Map(),k=(a,b,c)=>a+","+b+","+c;
  for(let i=0;i<N;i++){const c=k(Math.floor(B[i*3]/cel),Math.floor(B[i*3+1]/cel),Math.floor(B[i*3+2]/cel));(h.get(c)||h.set(c,[]).get(c)).push(i)}
  for(let i=0;i<N;i++){const cx=Math.floor(B[i*3]/cel),cy=Math.floor(B[i*3+1]/cel),cz=Math.floor(B[i*3+2]/cel),l=[];
    for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)for(let c=-1;c<=1;c++)for(const j of h.get(k(cx+a,cy+b,cz+c))||[])if(j!==i)l.push(j);
    viz.push(l.slice(0,6))}}
const luz=new Float32Array(N);let ondas=[],morph=0,ultimoT=0,acumulo=0,rot=0;
function onda(){ondas.push({f:[Math.floor(Math.random()*N)],vida:7})}
function ajustarCanvas(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1,w=Math.round(r.width*d),h=Math.round(r.height*d);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}}
function frame(t){
  ajustarCanvas();const W=cv.width,H=cv.height,S=Math.min(W,H)*.42,cx=W/2,cy=H*.44,d=window.devicePixelRatio||1;
  g.globalCompositeOperation="source-over";g.clearRect(0,0,W,H);
  const cor={espera:[56,189,248],ouvindo:[251,146,60],pensando:[96,205,255],falando:[45,212,191]}[modo];
  const dt=Math.min(.05,(t-ultimoT)/1000||0);ultimoT=t;
  let alvo=modo==="falando"?amp(analyser)*2.6:modo==="ouvindo"?amp(window._micAn)*3:0;nivel+=(Math.min(alvo,1)-nivel)*.3;
  const ritmo={espera:1.5,ouvindo:8,pensando:22,falando:3}[modo];
  acumulo+=dt*(ritmo+nivel*30);while(acumulo>1){acumulo--;onda()}
  morph+=((modo==="falando"?1:0)-morph)*.045;const m=morph*morph*(3-2*morph);
  /* base: chip */
  g.save();g.translate(cx,H*.92);g.scale(1,.3);g.rotate(Math.PI/4);const L=S*.85;
  g.strokeStyle=`rgba(${cor},.35)`;g.lineWidth=d;g.strokeRect(-L/2,-L/2,L,L);g.strokeRect(-L/4,-L/4,L/2,L/2);
  g.beginPath();for(let k=-3;k<=3;k++){const q=k*L/8,e=L*.16;g.moveTo(-L/2,q);g.lineTo(-L/2-e,q);g.moveTo(L/2,q);g.lineTo(L/2+e,q);g.moveTo(q,-L/2);g.lineTo(q,-L/2-e);g.moveTo(q,L/2);g.lineTo(q,L/2+e)}g.stroke();
  const gc=g.createRadialGradient(0,0,0,0,0,L*.45);gc.addColorStop(0,`rgba(${cor},${.45+nivel*.4})`);gc.addColorStop(1,`rgba(${cor},0)`);g.fillStyle=gc;g.fillRect(-L/2,-L/2,L,L);g.restore();
  /* feixe do chip até o holograma */
  const fb=g.createLinearGradient(0,cy,0,H*.92);fb.addColorStop(0,`rgba(${cor},0)`);fb.addColorStop(1,`rgba(${cor},.12)`);
  g.fillStyle=fb;g.beginPath();g.moveTo(cx-S*.55,cy+S*.2);g.lineTo(cx+S*.55,cy+S*.2);g.lineTo(cx+S*.12,H*.92);g.lineTo(cx-S*.12,H*.92);g.fill();
  /* sinapses */
  for(const o of ondas){const prox=[];for(const i of o.f){luz[i]=1;for(const j of viz[i])if(luz[j]<.5&&Math.random()<.45)prox.push(j)}o.f=prox.slice(0,14);o.vida--}
  ondas=ondas.filter(o=>o.vida>0&&o.f.length);
  /* pontos */
  rot+=dt*(.35*(1-m));const yaw=rot+Math.sin(t/2400)*.3*m,ca=Math.cos(yaw),sa=Math.sin(yaw);
  const fyaw=Math.sin(t/2600)*.32,fca=Math.cos(fyaw),fsa=Math.sin(fyaw),flut=Math.sin(t/1100)*.02;
  const varre=((t/1600)%1.4)-.2;
  g.globalCompositeOperation="lighter";
  for(let i=0;i<N;i++){
    let bx=B[i*3]*ca+B[i*3+2]*sa,bz=-B[i*3]*sa+B[i*3+2]*ca,by=B[i*3+1];
    let fx=F[i*3],fy=F[i*3+1]-mand[i]*nivel*.035,fz=F[i*3+2];
    let fx2=fx*fca+fz*fsa,fz2=-fx*fsa+fz*fca;
    const x=bx+(fx2-bx)*m,y=by+(fy-by)*m+flut,z=bz+(fz2-bz)*m;
    const per=1/(1.9-z*.55),X=cx+x*S*per*1.75,Y=cy-y*S*per*1.75;
    const prof=Math.max(0,Math.min(1,(z+.8)/1.6));
    luz[i]*=.9;
    const aB=(.06+.45*prof*prof)*Bl[i]+luz[i]*.9;
    let aF=.05+.85*sombra[i]**1.6;
    if(olhoP[i])aF=.12;if(irisP[i])aF=1;if(bocaL[i])aF=.02+(.0)*nivel;
    {const oy=F[i*3+1],ox=F[i*3],gh=nivel*.06*Math.max(0,1-(ox/.14)**2);if(gh>0&&oy<-.42&&oy>-.43-gh)aF=.02}
    const sc=1-Math.min(1,Math.abs((1-(F[i*3+1]+.95)/1.9)-varre)*10);if(sc>0)aF+=.35*sc;
    let a=aB*(1-m)+aF*m;
    const r=((.7+prof*.9+luz[i]*1.6)*(1-m)+(1.25+.4*sombra[i])*m)*d;
    g.fillStyle=luz[i]>.3&&m<.5?`rgba(255,${190-luz[i]*60},110,${Math.min(1,a)})`:`rgba(${cor},${Math.min(1,a)})`;
    g.fillRect(X-r/2,Y-r/2,r,r);
  }
  g.globalCompositeOperation="source-over";
  requestAnimationFrame(frame);
}

desenharAgentes();estado();poll();requestAnimationFrame(frame);setInterval(()=>{if(!ocupado)painel()},15000);
