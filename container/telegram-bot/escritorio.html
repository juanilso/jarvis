<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Jarvis · Escritório</title>
<style>
:root{--bg:#0b1220;--pn:#111a2c;--ln:#24324d;--ln2:#3b5480;--c:#38bdf8;--t:#e2ecff;--m:#7d8fb0;--ok:#34d399;--er:#fb7185;--ou:#fbbf24;
--mono:ui-monospace,"Cascadia Code",Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--ln);max-width:1500px;margin:0 auto}
.logo{font:600 15px var(--mono);letter-spacing:.3em;color:var(--c);margin-right:auto}
.logo small{display:block;letter-spacing:.1em;font-size:10px;color:var(--m);font-weight:400}
.pill{font:11px var(--mono);padding:4px 9px;border:1px solid var(--ln);border-radius:20px;color:var(--m)}
.pill.on{color:var(--ok);border-color:rgba(52,211,153,.45)}
.btn{font:inherit;font-size:13px;color:var(--t);background:#16223a;border:1px solid var(--ln);border-radius:7px;padding:6px 11px;text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--ln2)}.btn.pri{background:#0e4a6b;border-color:#1d7fae}.btn.per{color:var(--er)}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;padding:14px;max-width:1500px;margin:0 auto}
@media(max-width:1000px){main{grid-template-columns:1fr}}
h2{margin:0 0 8px;font:600 11px var(--mono);letter-spacing:.18em;color:var(--m);text-transform:uppercase}
.planta{border:1px solid var(--ln);border-radius:12px;background:#0a101c;padding:8px;overflow:hidden}
canvas{display:block;width:100%;image-rendering:pixelated;cursor:pointer;touch-action:manipulation}
.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--m);margin-top:8px}
.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
aside{display:flex;flex-direction:column;gap:14px}
.card{border:1px solid var(--ln);border-radius:12px;padding:12px;background:var(--pn)}
.det .nm{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
.det .nm i{width:12px;height:12px;border-radius:3px;display:inline-block}
.det .fn{color:var(--m);font-size:13px}.det .st{margin:8px 0;padding:8px;border-radius:8px;background:#0b1424;font-size:13px}
.tag{font:10px var(--mono);padding:2px 7px;border-radius:10px;border:1px solid var(--ln);color:var(--m);text-transform:uppercase}
.tag.trabalhando{color:var(--ok);border-color:rgba(52,211,153,.5)}.tag.atencao,.tag.vaga{color:var(--ou);border-color:rgba(251,191,36,.5)}
.tag.erro{color:var(--er);border-color:rgba(251,113,133,.5)}
.ativos div{font-size:13px;padding:5px 0;border-bottom:1px dashed var(--ln);cursor:pointer}.ativos div:last-child{border:0}
.vazio{color:var(--m);font-size:13px}
form label{display:block;font-size:12px;color:var(--m);margin-top:8px}
form input,form select,form textarea{width:100%;font:inherit;font-size:13px;color:var(--t);background:#0b1424;border:1px solid var(--ln);border-radius:7px;padding:7px}
form input[type=color]{height:34px;padding:2px 4px;cursor:pointer}
form textarea{min-height:70px;resize:vertical}.linha{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.rot{border-bottom:1px dashed var(--ln);padding:7px 0;font-size:13px}.rot:last-child{border:0}
.rot .q{float:right;font:10px var(--mono);color:var(--m)}.rot .ac{font:10px var(--mono);color:var(--m);text-transform:uppercase}
.rot details{font-size:12px;color:#b9c8e6}.rot pre{white-space:pre-wrap;font:12px/1.45 system-ui;max-height:220px;overflow:auto;margin:4px 0 0}
.msg{font-size:12px;margin-top:6px}.msg.er{color:var(--er)}
</style>
</head>
<body>
<header>
  <div class="logo">ESCRITÓRIO<small>jarvis · sua equipe trabalhando</small></div>
  <span class="pill" id="pRod">—</span><span class="pill" id="pN8n">n8n</span>
  <button class="btn pri" id="novaMesa">＋ Nova mesa</button>
  <a class="btn" id="abrirN8n" target="_blank" rel="noopener">⚙ n8n</a>
  <a class="btn" href="/">← painel</a>
</header>
<main>
  <section>
    <div class="planta"><canvas id="cv" aria-label="Planta do escritório: clique em uma mesa para ver detalhes"></canvas></div>
    <div class="leg"><span><i style="background:var(--ok)"></i>trabalhando</span><span><i style="background:#64748b"></i>livre (às vezes vai tomar um café)</span>
      <span><i style="background:var(--ou)"></i>precisa de você / vaga</span><span><i style="background:#334155"></i>desligado</span>
      <span>📄 = Jarvis passando um trabalho</span></div>
  </section>
  <aside>
    <div class="card det" id="det"><h2>Detalhes</h2><div class="vazio">Clique em uma mesa.</div></div>
    <div class="card"><h2>Trabalhando agora</h2><div class="ativos" id="ativos"><div class="vazio">—</div></div></div>
    <div class="card"><h2>Quadro de rotinas</h2><div id="rotinas"><div class="vazio">carregando…</div></div></div>
  </aside>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ORDEM=["comando","atendimento","conteudo","crescimento","consultoria","automacao","dev"];
let W=640;const SLOT_W=70,SLOT_H=62,COLS=4,GAP=16;
let D=null,layout=null,sel=null,antes={},folhas=[],pessoas={},ESCALA=2,H=400;
const cv=$("cv"),cx=cv.getContext("2d");

function montarLayout(){
  W=(cv.clientWidth||640)<700?330:640; // celular: planta mais estreita (salas empilhadas, bonecos maiores)
  const porSetor={};D.mesas.forEach(m=>(porSetor[m.setor]=porSetor[m.setor]||[]).push(m));
  const salas=[];ORDEM.forEach(s=>{if(porSetor[s])salas.push({setor:s,nome:D.setores[s]||s,mesas:porSetor[s]})});
  salas.push({setor:"copa",nome:"Copa · café e reunião",mesas:[]});
  let x=GAP,y=GAP,linhaH=0,linha=[];const desks={},linhas=[linha];
  salas.forEach(sa=>{
    const n=sa.mesas.length,c=sa.setor==="copa"?2:Math.min(n,COLS),r=sa.setor==="copa"?1:Math.ceil(n/COLS);
    sa.w=c*SLOT_W+12;sa.h=r*SLOT_H+26;
    if(x+sa.w>W-GAP){x=GAP;y+=linhaH+GAP+6;linhaH=0;linha=[];linhas.push(linha)}
    linha.push(sa);
    sa.x=x;sa.y=y;x+=sa.w+GAP;linhaH=Math.max(linhaH,sa.h);sa.porta={x:sa.x+sa.w/2,y:sa.y+sa.h};
    sa.mesas.forEach((m,i)=>{const dx=sa.x+6+(i%COLS)*SLOT_W,dy=sa.y+22+Math.floor(i/COLS)*SLOT_H;
      desks[m.id]={x:dx,y:dy,sala:sa,assento:{x:dx+SLOT_W/2,y:dy+24}}});
  });
  H=y+linhaH+GAP+8;
  linhas.forEach(l=>{const fundo=Math.max(...l.map(sa=>sa.y+sa.h));l.forEach(sa=>sa.corr=fundo+GAP/2+2)}); // corredor por fileira
  const copa=salas[salas.length-1];
  copa.lugares=[[30,30],[50,30],[70,30],[90,40],[110,34],[60,50],[100,52],[125,48]].map(([a,b])=>({x:copa.x+a,y:copa.y+b}));
  layout={salas,desks,copa};
  const larg=cv.clientWidth||640;ESCALA=Math.max(1,larg/W);
  const dpr=window.devicePixelRatio||1;cv.width=Math.round(W*ESCALA*dpr);cv.height=Math.round(H*ESCALA*dpr);
  cv.style.height=(H*ESCALA)+"px";cx.setTransform(ESCALA*dpr,0,0,ESCALA*dpr,0,0);cx.imageSmoothingEnabled=false;
  // pessoas: uma por mesa que não é vaga
  const novos={};
  D.mesas.forEach(m=>{const d=desks[m.id];if(!d)return;
    const p=pessoas[m.id]||{pausa:0};  // a planta mudou: todo mundo volta para a própria mesa
    Object.assign(p,{mesa:m,casa:d.assento,x:d.assento.x,y:d.assento.y,rota:[],naCopa:false});novos[m.id]=p});
  pessoas=novos;
}
function rota(de,ate,salaDe,salaAte){
  const pts=[{x:de.x,y:salaDe.porta.y-4},{x:salaDe.porta.x,y:salaDe.porta.y-4},{x:salaDe.porta.x,y:salaDe.corr}];
  if(salaDe.corr!==salaAte.corr){pts.push({x:6,y:salaDe.corr},{x:6,y:salaAte.corr})}
  pts.push({x:salaAte.porta.x,y:salaAte.corr},{x:salaAte.porta.x,y:salaAte.porta.y-4},{x:ate.x,y:salaAte.porta.y-4},{x:ate.x,y:ate.y});
  return pts;
}
const COR_EST={trabalhando:"#34d399",livre:"#64748b",atencao:"#fbbf24",vaga:"#fbbf24",desligado:"#334155",ok:"#34d399",erro:"#fb7185"};
function situ(id){return (D.situacao||{})[id]||{estado:"livre",texto:""}}
function px(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(Math.round(x),Math.round(y),w,h)}
function boneco(x,y,cor,est,t,sentado,andando){
  const cin=est==="desligado";const pele=cin?"#5b6475":"#f2c9a0",cab=cin?"#3a4252":"#3b2a20",cam=cin?"#475063":cor;
  x=Math.round(x-5);y=Math.round(y-18);
  const b=est==="trabalhando"&&sentado?(Math.floor(t/180)%2):0;
  px(x+2,y,6,2,cab);px(x+1,y+2,8,5,pele);px(x+1,y+1,8,2,cab);
  px(x+3,y+4,1,1,"#111");px(x+6,y+4,1,1,"#111");
  px(x+1,y+7,8,7,cam);
  if(sentado){px(x-1+b,y+9,2,3,pele);px(x+9-b,y+9,2,3,pele)}else{px(x-1,y+8,2,4,cam);px(x+9,y+8,2,4,cam)}
  const p=andando?Math.floor(t/140)%2:0;
  px(x+2,y+14,2,4-p,"#1e293b");px(x+6,y+14,2,3+p,"#1e293b");
  if(est==="desligado"&&Math.floor(t/700)%2){cx.fillStyle="#94a3b8";cx.font="6px monospace";cx.fillText("z",x+11,y+2)}
}
function mesa(d,m,s,t){
  const x=d.x,y=d.y,vaga=s.estado==="vaga";
  if(vaga){cx.strokeStyle="#fbbf24";cx.setLineDash([2,2]);cx.strokeRect(x+4.5,y+2.5,SLOT_W-9,SLOT_H-12);cx.setLineDash([])}
  if(sel===m.id){cx.strokeStyle=m.cor;cx.lineWidth=1;cx.strokeRect(x+2.5,y+.5,SLOT_W-5,SLOT_H-7)}
  // cadeira
  px(x+29,y+20,12,10,vaga?"#3b3f4a":"#2b3446");
  const p=pessoas[m.id];const sentado=p&&Math.hypot(p.x-p.casa.x,p.y-p.casa.y)<1;
  if(!vaga&&p&&sentado)boneco(p.x,p.y,m.cor,s.estado,t,true,false);
  // mesa e monitor
  px(x+10,y+28,50,8,"#6b4a2f");px(x+10,y+36,50,2,"#4a3220");px(x+12,y+38,3,8,"#4a3220");px(x+55,y+38,3,8,"#4a3220");
  const tela=s.estado==="trabalhando"?(Math.floor(t/400)%2?m.cor:"#e2e8f0"):s.estado==="atencao"?"#fbbf24":s.estado==="erro"?"#fb7185":"#0f172a";
  px(x+40,y+18,16,11,"#1f2937");px(x+41,y+19,14,8,tela);px(x+47,y+29,2,1,"#1f2937");
  if(s.estado==="trabalhando"){for(let i=0;i<3;i++)px(x+42,y+20+i*2,4+((Math.floor(t/200)+i*3)%8),1,"#0b1220")}
  if(vaga){cx.fillStyle="#fbbf24";cx.font="bold 7px monospace";cx.fillText("VAGA",x+16,y+24)}
  // nome
  cx.fillStyle=vaga?"#a3864a":s.estado==="desligado"?"#56627a":"#cbd5e1";cx.font="6px system-ui,sans-serif";cx.textAlign="center";
  cx.fillText(m.nome.length>16?m.nome.slice(0,15)+"…":m.nome,x+SLOT_W/2,y+SLOT_H-11);cx.textAlign="left";
  // balão
  if(!vaga&&p&&sentado&&(s.estado==="trabalhando"||s.estado==="atencao"||s.estado==="erro")){
    const bx=x+19,by=y-4;px(bx,by,18,9,"#f8fafc");px(bx+3,by+9,3,2,"#f8fafc");
    if(s.estado==="trabalhando"){const n=Math.floor(t/300)%4;for(let i=0;i<n;i++)px(bx+3+i*4,by+4,2,2,"#0f172a")}
    else{cx.fillStyle=s.estado==="erro"?"#e11d48":"#b45309";cx.font="bold 8px monospace";cx.fillText("!",bx+7,by+8)}
  }
  // luz de estado
  px(x+6,y+4,3,3,COR_EST[s.estado]||"#64748b");
}
function copa(sa,t){
  px(sa.x+20,sa.y+38,40,10,"#6b4a2f");px(sa.x+20,sa.y+48,40,2,"#4a3220"); // mesa de reunião
  px(sa.x+sa.w-24,sa.y+20,12,16,"#475569");px(sa.x+sa.w-22,sa.y+22,8,5,"#0ea5e9");px(sa.x+sa.w-20,sa.y+30,4,4,"#78350f"); // cafeteira
  px(sa.x+8,sa.y+sa.h-16,6,10,"#166534");px(sa.x+6,sa.y+sa.h-20,10,6,"#22c55e"); // planta
}
function desenhar(t){
  if(!D||!layout)return;
  cx.clearRect(0,0,W,H);px(0,0,W,H,"#0d1424");
  for(let i=0;i<W;i+=16)for(let j=0;j<H;j+=16)if((i/16+j/16)%2)px(i,j,16,16,"#0f1729");
  layout.salas.forEach(sa=>{
    px(sa.x,sa.y,sa.w,sa.h,sa.setor==="copa"?"#1b2433":"#152036");
    cx.strokeStyle="#33476b";cx.lineWidth=2;cx.strokeRect(sa.x,sa.y,sa.w,sa.h);
    px(sa.porta.x-9,sa.porta.y-1,18,3,"#0d1424");
    cx.fillStyle="#8ea3c7";cx.font="bold 7px system-ui,sans-serif";cx.fillText(sa.nome.toUpperCase(),sa.x+6,sa.y+11);
    if(sa.setor==="copa")copa(sa,t);
  });
  D.mesas.forEach(m=>{const d=layout.desks[m.id];if(d)mesa(d,m,situ(m.id),t)});
  Object.values(pessoas).forEach(p=>{const s=situ(p.mesa.id);if(s.estado==="vaga")return;
    if(Math.hypot(p.x-p.casa.x,p.y-p.casa.y)>=1)boneco(p.x,p.y,p.mesa.cor,s.estado,t,false,p.rota.length>0)});
  folhas.forEach(f=>{const k=Math.min(1,(t-f.t0)/1200),x=f.a.x+(f.b.x-f.a.x)*k,y=f.a.y+(f.b.y-f.a.y)*k-Math.sin(k*Math.PI)*30;
    px(x-3,y-4,6,8,"#f8fafc");px(x-2,y-2,4,1,"#94a3b8");px(x-2,y,4,1,"#94a3b8")});
  folhas=folhas.filter(f=>t-f.t0<1200);
}
function mover(dt){
  Object.values(pessoas).forEach(p=>{
    const s=situ(p.mesa.id).estado,d=layout.desks[p.mesa.id];if(!d||s==="vaga")return;
    if(p.rota.length){const a=p.rota[0],dx=a.x-p.x,dy=a.y-p.y,dist=Math.hypot(dx,dy),v=dt*0.045;
      if(dist<=v){p.x=a.x;p.y=a.y;p.rota.shift()}else{p.x+=dx/dist*v;p.y+=dy/dist*v}return}
    const voltar=()=>{p.rota=rota({x:p.x,y:p.y},p.casa,layout.copa,d.sala);p.naCopa=false};
    if(p.naCopa){if(s==="trabalhando"||s==="atencao"||(p.pausa-=dt)<=0)voltar();return}
    if(s==="livre"&&p.mesa.id!=="jarvis"&&Math.random()<dt/90000){
      const vagos=layout.copa.lugares.filter(l=>!Object.values(pessoas).some(o=>o.naCopa&&o.alvo===l));if(!vagos.length)return;
      const l=vagos[Math.floor(Math.random()*vagos.length)];p.alvo=l;p.naCopa=true;p.pausa=8000+Math.random()*15000;
      p.rota=rota(p.casa,l,d.sala,layout.copa)}
  });
}
let ult=performance.now();
function loop(t){mover(Math.min(100,t-ult));ult=t;desenhar(t);requestAnimationFrame(loop)}

function detalhes(id){
  sel=id;const m=(D.mesas||[]).find(x=>x.id===id);if(!m){$("det").innerHTML='<h2>Detalhes</h2><div class="vazio">Clique em uma mesa.</div>';return}
  const s=situ(id),edit=m.tipo!=="fixa";
  const opts=Object.entries(D.setores).map(([k,v])=>`<option value="${k}"${k===m.setor?" selected":""}>${esc(v)}</option>`).join("");
  $("det").innerHTML=`<h2>Detalhes</h2><div class="nm"><i style="background:${esc(m.cor)}"></i>${esc(m.nome)}</div>
   <div class="fn">${esc(m.funcao)}</div>${id==="pessoal"?'<div><a class="btn" href="/#reginaldo">📝 Abrir anotações, pesquisas e lista</a></div>':""}<div class="st"><span class="tag ${esc(s.estado)}">${esc(s.estado)}</span> ${esc(s.texto)}</div>
   ${m.tipo==="fixa"?'<div class="vazio">Agente que já trabalha no Jarvis. Dá para renomear e trocar a cor.</div>':
     '<div class="vazio">Mesa planejada: ainda não é um agente de verdade. Anote aqui o que ele vai fazer; quando quiser contratar, é só pedir ao Jarvis.</div>'}
   <form id="fm"><label>Nome<input name="nome" maxlength="40" value="${esc(m.nome)}"></label>
    <label>Função<input name="funcao" maxlength="120" value="${esc(m.funcao)}"></label>
    ${edit?`<label>Setor<select name="setor">${opts}</select></label>`:""}
    <label>Cor<input name="cor" type="color" value="${esc(m.cor)}"></label>
    ${edit?`<label>Anotações (o que ele vai fazer)<textarea name="notas" maxlength="1000">${esc(m.notas||"")}</textarea></label>`:""}
    <div class="linha"><button class="btn pri">Salvar</button>${edit?'<button type="button" class="btn per" id="apg">Apagar mesa</button>':""}</div>
    <div class="msg" id="fmMsg"></div></form>`;
  $("fm").onsubmit=e=>{e.preventDefault();salvar(Object.assign({id},Object.fromEntries(new FormData($("fm")))))};
  if($("apg"))$("apg").onclick=async()=>{if(!confirm(`Apagar a mesa "${m.nome}"?`))return;
    const r=await post("/api/escritorio/apagar",{id});if(r.ok){sel=null;await atualizar(true);detalhes(null)}else $("fmMsg").textContent=r.erro};
}
function novaMesa(){
  sel=null;const opts=Object.entries(D.setores).filter(([k])=>k!=="comando").map(([k,v])=>`<option value="${k}"${k==="crescimento"?" selected":""}>${esc(v)}</option>`).join("");
  $("det").innerHTML=`<h2>Nova mesa</h2><div class="vazio">Ex.: "Grupo de benefícios", que divulga descontos e promoções. Ela entra como <b>vaga</b>
   e vira agente de verdade quando você pedir ao Jarvis.</div>
   <form id="fm"><label>Nome<input name="nome" maxlength="40" placeholder="Grupo de benefícios" required></label>
    <label>Função<input name="funcao" maxlength="120" placeholder="Divulga descontos e promoções no grupo"></label>
    <label>Setor<select name="setor">${opts}</select></label><label>Cor<input name="cor" type="color" value="#22d3ee"></label>
    <label>Anotações<textarea name="notas" maxlength="1000" placeholder="Onde publica, com que frequência, quem aprova…"></textarea></label>
    <div class="linha"><button class="btn pri">Criar mesa</button></div><div class="msg" id="fmMsg"></div></form>`;
  $("fm").onsubmit=e=>{e.preventDefault();salvar(Object.fromEntries(new FormData($("fm"))))};
}
async function post(u,b){try{const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});return await r.json()}catch(e){return{ok:false,erro:"sem conexão"}}}
async function salvar(b){const r=await post("/api/escritorio/mesa",b);
  if(!r.ok){$("fmMsg").className="msg er";$("fmMsg").textContent=r.erro||"erro";return}
  await atualizar(true);detalhes(r.id);$("fmMsg").textContent="✓ salvo"}

async function atualizar(relayout){
  let d;try{const r=await fetch("/api/escritorio");if(r.status===401){location.href="/";return}d=await r.json()}catch(e){return}
  const mudou=!D||JSON.stringify(D.mesas)!==JSON.stringify(d.mesas);D=d;
  if(mudou||relayout)montarLayout();
  // Jarvis passa trabalho: folha voando da mesa do Jarvis para quem começou agora
  const jd=layout.desks.jarvis;
  D.mesas.forEach(m=>{const s=situ(m.id).estado;if(s==="trabalhando"&&antes[m.id]&&antes[m.id]!=="trabalhando"&&m.id!=="jarvis"&&jd&&layout.desks[m.id])
    folhas.push({a:{x:jd.assento.x,y:jd.assento.y-10},b:{x:layout.desks[m.id].assento.x,y:layout.desks[m.id].assento.y-10},t0:performance.now()});antes[m.id]=s});
  const trab=D.mesas.filter(m=>["trabalhando","atencao","erro"].includes(situ(m.id).estado));
  $("pRod").textContent=trab.length?`⏳ ${trab.length} ocupado(s)`:"💤 todos livres";$("pRod").className="pill"+(trab.length?" on":"");
  $("pN8n").textContent=D.n8n?"⚙ rotinas ligadas":"⚙ rotinas desligadas";$("pN8n").className="pill"+(D.n8n?" on":"");
  $("ativos").innerHTML=trab.length?trab.map(m=>`<div data-id="${esc(m.id)}"><b style="color:${esc(m.cor)}">${esc(m.nome)}</b> · ${esc(situ(m.id).texto)}</div>`).join("")
    :'<div class="vazio">Ninguém trabalhando agora.</div>';
  $("ativos").querySelectorAll("[data-id]").forEach(e=>e.onclick=()=>detalhes(e.dataset.id));
  if(sel&&!$("fm"))detalhes(sel);
  else if(sel){const st=document.querySelector("#det .st");const s=situ(sel);if(st)st.innerHTML=`<span class="tag ${esc(s.estado)}">${esc(s.estado)}</span> ${esc(s.texto)}`}
  const rs=D.rotinas||[];
  $("rotinas").innerHTML=rs.length?rs.map(r=>{const st=r.ok===true?"✅":r.ok===false?"❌":"⏳";
    return `<div class="rot">${st} <b>${esc(r.rotina)}</b><span class="q">${esc((r.fim||r.quando||"").slice(5,16))}</span>
      <div class="ac">${esc(r.acao)}${r.projeto?" · "+esc(r.projeto):""}</div>
      ${r.resultado&&r.resultado!=="iniciada"?`<details><summary>resultado</summary><pre>${esc(r.resultado)}</pre></details>`:""}</div>`}).join("")
    :`<div class="vazio">Nenhuma rotina rodou ainda.${D.n8n?"":" Ligue com <code>./automacoes-configurar.sh</code> na VPS."}</div>`;
}
cv.addEventListener("click",e=>{if(!layout)return;const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  const m=D.mesas.find(m=>{const d=layout.desks[m.id];return d&&x>=d.x&&x<d.x+SLOT_W&&y>=d.y-6&&y<d.y+SLOT_H});
  if(m){detalhes(m.id);if(innerWidth<1000)$("det").scrollIntoView({behavior:"smooth"})}});
$("novaMesa").onclick=()=>{if(D){novaMesa();if(innerWidth<1000)$("det").scrollIntoView({behavior:"smooth"})}};
$("abrirN8n").href=`${location.protocol}//${location.hostname}:5678/`;
addEventListener("resize",()=>{if(D)montarLayout()});
atualizar().then(()=>requestAnimationFrame(loop));setInterval(atualizar,2000);
</script>
</body>
